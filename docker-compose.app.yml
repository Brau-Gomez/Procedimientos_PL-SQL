# Interfaz web de KOPERA
#
# Se mantiene en un compose APARTE del docker-compose.yml de Oracle: la app
# solo lee MongoDB, y levantar Oracle (2 GB de RAM) para mirar reportes no
# tiene sentido.
#
# Uso:
#   docker compose -f docker-compose.app.yml up -d --build
#   docker compose -f docker-compose.app.yml logs -f web
#   docker compose -f docker-compose.app.yml down
#
# Abrir en: http://localhost:8501
# Nombre EXPLICITO del proyecto de Docker Compose, para que los
# contenedores de la app no se mezclen con los de Oracle (que usan el
# proyecto "kopera"). Ver la nota de docker-compose.yml.
name: kopera-app

services:
  web:
    build:
      context: .
      dockerfile: Kopera/app/Dockerfile
    container_name: kopera-web
    ports:
      - "8501:8501"
    # MONGODB_URI y MONGODB_DATABASE salen del .env de la raiz (el mismo que
    # usa el ETL). Ese archivo esta en .gitignore.
    env_file:
      - .env
    # El codigo se monta para desarrollo: al guardar un archivo, Streamlit
    # recarga solo (runOnSave). Al desplegar, se puede quitar el volumen.
    volumes:
      - ./Kopera/app:/app
      # Los modulos del ETL se montan SOLO LECTURA para que la app reutilice
      # validaciones.py (reglas de los triggers) y transformacion.py
      # (recalcular_analisis) en vez de duplicar esa logica. Nunca se importa
      # scripts/config.py, que arrastra el driver de Oracle.
      - ./Kopera/etl:/etl:ro
    command: >
      streamlit run main.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.runOnSave=true
    restart: unless-stopped
