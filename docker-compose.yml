# Servicios del proyecto KOPERA.
#
# Las credenciales NO viven aqui: salen del archivo .env. Copia .env.example como .env y
# completa los valores:
#
#     cp .env.example .env
#
# Docker Compose lee ese .env automaticamente para resolver las variables
# ${...} de este archivo. La sintaxis ${VAR:?mensaje} aborta el arranque
# con un mensaje claro si la variable falta o esta vacia, en vez de dejar
# el contenedor con una contrasena vacia que fallaria mas tarde y sin
# explicación.

# Nombre EXPLICITO del proyecto de Docker Compose.
#
# Sin esto, Compose deriva el nombre del proyecto del nombre de la CARPETA
# donde estas, y el mismo repo clonado en dos carpetas se convierte en dos
# proyectos distintos. Con el nombre fijo, ambos clones son el MISMO
# proyecto: comparten los contenedores y el volumen, y `docker compose up -d`
# desde cualquiera de los dos reutiliza el contenedor que ya esta corriendo.
#
# El compose de la app web usa su propio nombre (kopera-app) para que sus
# contenedores no se mezclen con estos.
name: kopera

services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      # Contrasena del usuario SYS del contenedor. Debe ser la misma que
      # ORACLE_PASSWORD del .env, porque ese usuario es el que se conecta
      # despues como ADMIN_PROYECTO.
      ORACLE_PWD: ${ORACLE_PASSWORD:?falta ORACLE_PASSWORD en el archivo .env de la raiz del repositorio}
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped

volumes:
  # Volumen COMPARTIDO entre todos los clones del repo.
  #
  # Por que con nombre explicito:
  #   Docker Compose deriva el nombre del volumen del nombre de la CARPETA
  #   donde estas. Si clonás el repo en otra carpeta (por ejemplo
  #   /test/Procedimientos_PL-SQL), te crea un volumen NUEVO y vacio: la base
  #   arranca sin tablas y el usuario ADMIN_PROYECTO no existe, asi que todo
  #   falla con ORA-01017 "invalid credential" al conectar.
  #   Con el nombre fijo, todos los clones comparten la misma base de datos.
  #
  # Por que external: true:
  #   el volumen tiene que existir ANTES de levantar el compose, porque es
  #   compartido y no debe depender de qué proyecto lo creó primero.
  #   Se crea una sola vez (el comando es idempotente, si ya existe no hace
  #   nada):
  #
  #       docker volume create kopera_oracle_data
  oracle_data:
    name: kopera_oracle_data
    external: true
